
services:

  mysql:
    image: mysql:8.0
    container_name: tickets-s3-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tickets_db
      MYSQL_USER: ${DB_USER:-tickets_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    image: floreseng/tickets-s3:latest
    build: .
    container_name: tickets-s3-app
    restart: unless-stopped
    network_mode: host
    environment:
      SERVER_PORT: 8082
      DB_HOST: 127.0.0.1
      DB_PORT: 3307
      DB_NAME: tickets_db
      DB_USER: ${DB_USER:-tickets_user}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      STORAGE_DIR: /app/efs-data
    volumes:
      - ${STORAGE_HOST_DIR:-./efs-data}:/app/efs-data

volumes:
  mysql_data:
